name: Pata HAO CI

on:
  push:
    branches:
      - main
      - feature/simple-property-posting
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: patahao-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Django backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PATAHAO_ENVIRONMENT: development
      DJANGO_DEBUG: "true"
      ENABLE_DEVELOPMENT_PAYMENT_HANDOFF: "true"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run Django system check
        working-directory: backend
        run: python manage.py check

      - name: Verify committed migrations
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run

      - name: Run backend tests
        working-directory: backend
        run: python manage.py test -v 1

  mobile:
    name: Flutter mobile
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Flutter 3.44.5
        shell: bash
        run: |
          git clone \
            --branch 3.44.5 \
            --depth 1 \
            https://github.com/flutter/flutter.git \
            "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" config --no-analytics
          "$RUNNER_TEMP/flutter/bin/flutter" --version

      - name: Install mobile dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze mobile code
        working-directory: mobile
        run: flutter analyze

      - name: Run mobile tests
        working-directory: mobile
        run: flutter test
